[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ndlocr-lite"
version = "1.4.0"
description = "NDLOCR-Lite CLI Application"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.scripts]
ndlocr-lite = "cli:main"

[tool.setuptools]
py-modules = ["cli", "model_download", "ocr", "deim", "parseq", "ndl_parser", "tcy_wrapper","pdf_output_utils","version"]

[tool.setuptools.package-dir]
"" = "src"
ndlocr_lite_gui = "ndlocr-lite-gui"

[tool.setuptools.package-data]
"config" = ["*.yaml"]
"ndlocr_lite_gui" = ["assets/*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.onnx"]